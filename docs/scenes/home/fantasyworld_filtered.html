const snapshotButton=document.createElement('button');
snapshotButton.id='snapshotSave';
snapshotButton.textContent='保存白底图片';
snapshotButton.title='保存当前帧和当前视角，PNG背景为不透明白色';
snapshotButton.className='snapshotFloating';
document.querySelector('.stage').append(snapshotButton);
const snapshotDialog=document.createElement('dialog');
snapshotDialog.className='snapshotDialog';
snapshotDialog.id='snapshotDialog';
snapshotDialog.innerHTML='<div class="actions"><strong>白底 PNG 预览</strong><button type="button" id="snapshotClose">关闭</button></div><p id="snapshotInfo"></p><img id="snapshotPreview" alt="当前点云的白色背景截图"><div class="actions"><a class="downloadAction" id="snapshotDownload">下载 PNG</a></div><p>只导出当前点云画布与相机轨迹，不包含控件。浏览器未自动下载时，请点击“下载 PNG”。</p>';
document.body.appendChild(snapshotDialog);
const snapshotPreview=document.getElementById('snapshotPreview');
const snapshotDownload=document.getElementById('snapshotDownload');
document.getElementById('snapshotClose').onclick=()=>snapshotDialog.close();
snapshotButton.onclick=()=>{
  if(video.readyState<2 || video.seeking || canvas.dataset.renderedFrame!==String(current)){
    status.textContent='当前帧正在加载，请稍后再保存图片';
    return;
  }
  snapshotButton.disabled=true;
  const savedFrame=current+1;
  try{
    const capture=document.createElement('canvas');
    // All operations up to restoring draw() are synchronous. The recording
    // canvas is restored before the next browser paint/captureStream frame.
    window.snapshotWhiteBackground=true;
    draw();
    capture.width=canvas.width;capture.height=canvas.height;
    const ctx=capture.getContext('2d',{alpha:false});
    if(!ctx)throw new Error('无法创建截图画布');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,capture.width,capture.height);
    ctx.drawImage(canvas,0,0);
    window.snapshotWhiteBackground=false;
    draw();
    const png=capture.toDataURL('image/png');
    const stamp=new Date().toISOString().replace(/[:.]/g,'-');
    snapshotPreview.src=png;
    snapshotDownload.href=png;
    snapshotDownload.download=`${data.caseName}_frame_${String(savedFrame).padStart(3,'0')}_white_${stamp}.png`;
    document.getElementById('snapshotInfo').textContent=`${data.caseName} · 第 ${savedFrame} 帧 · ${capture.width} × ${capture.height} · 白色不透明背景`;
    snapshotDialog.showModal();
    snapshotDownload.click();
  }catch(error){
    status.textContent='保存图片失败：'+error.message;
  }finally{
    window.snapshotWhiteBackground=false;
    draw();
    snapshotButton.disabled=false;
  }
};


window.addEventListener('message',async e=>{
 if(e.source!==parent || e.data?.type!=='pointcloud-frame')return;
 playing=false;clearTimeout(timer);playBtn.textContent='播放';
 await setFrame(e.data.frame);
 parent.postMessage({type:'pointcloud-ready',frame:current},'*');
});
// VIEW_SYNC_PLAYER_BEGIN
const viewHome = {target: [...target], distance};
const validView = v => v && Number.isFinite(v.yaw) && Number.isFinite(v.pitch) &&
  Number.isFinite(v.distance) && v.distance > 0 && Array.isArray(v.target) &&
  v.target.length === 3 && v.target.every(Number.isFinite);
function viewSnapshot() {
  const absolute = {yaw, pitch, distance, target: [...target]};
  return {absolute, relative: {yaw, pitch, zoom: distance / viewHome.distance,
    pan: target.map((v, i) => (v - viewHome.target[i]) / viewHome.distance)}};
}
function exposeView() {
  canvas.dataset.viewState = JSON.stringify(viewSnapshot());
}
function publishView(type = 'pointcloud-view-change') {
  exposeView();
  if (parent !== window) parent.postMessage({type, view: viewSnapshot()}, location.origin);
}
let viewPublishFrame = 0;
function scheduleView() {
  if (viewPublishFrame) return;
  viewPublishFrame = requestAnimationFrame(() => {viewPublishFrame = 0; publishView();});
}
canvas.addEventListener('pointermove', e => {if (e.buttons) scheduleView();});
canvas.addEventListener('wheel', scheduleView, {passive: true});
canvas.addEventListener('dblclick', scheduleView);
document.getElementById('reset').addEventListener('click', scheduleView);
window.addEventListener('message', e => {
  if (e.source !== parent || e.origin !== location.origin) return;
  if (e.data?.type === 'pointcloud-view-request') {publishView(); return;}
  if (e.data?.type === 'pointcloud-view-home') {reset(); publishView(); return;}
  if (e.data?.type !== 'pointcloud-view-apply') return;
  const state = e.data.view;
  if (!state || !validView(state.absolute)) return;
  let next = state.absolute;
  if (e.data.mode === 'relative') {
    const r = state.relative;
    if (!r || !Number.isFinite(r.zoom) || r.zoom <= 0 || !Array.isArray(r.pan) ||
        r.pan.length !== 3 || !r.pan.every(Number.isFinite)) return;
    next = {yaw: state.absolute.yaw, pitch: state.absolute.pitch,
      distance: r.zoom * viewHome.distance,
      target: viewHome.target.map((v, i) => v + r.pan[i] * viewHome.distance)};
  } else if (e.data.mode !== 'absolute') return;
  if (!validView(next)) return;
  yaw = next.yaw; pitch = Math.max(-1.45, Math.min(1.45, next.pitch));
  distance = next.distance; target = [...next.target];
  draw(); exposeView();
  // Applying a remote view never broadcasts, preventing feedback loops.
});
publishView('pointcloud-view-ready');
// VIEW_SYNC_PLAYER_END

})().catch(error=>{document.getElementById('status').textContent='加载失败: '+error.message;console.error(error)});
